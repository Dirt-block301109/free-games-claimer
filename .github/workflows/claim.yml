name: Claim Games
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run Clamer
        run: node epic-games
        env:
          EMAIL: ${{ secrets.EPIC_EMAIL }}
          PASSWORD: ${{ secrets.EPIC_PASSWORD }}
      - name: Upload Screenshot if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: epic-login-screenshot
          path: data/browser/
